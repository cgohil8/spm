name: OSLDynamics toolbox
on:
  push:
    branches: [osl-dynamics]
    paths:
      - 'toolbox/OSLDynamics/**'
      - 'tests/test_spm_osld.m'
      - '.github/workflows/osl_dynamics.yml'
  workflow_dispatch:
jobs:
  test:
    name: ${{ matrix.os }} ${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, version: latest}
          - {os: ubuntu-latest, version: latest}
          - {os: ubuntu-latest, version: R2020b}
          - {os: macos-15, version: latest}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Install Visual C++ 2010 Redistributable (required by FieldTrip MEX files)
        if: runner.os == 'Windows'
        run: choco install vcredist2010 -y

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@f9e43010f1ae678f7cfa0542fe2a4f60f7d1ad8d # v3.1.0
        with:
          release: ${{ matrix.version }}

      - name: Install osl-dynamics (default location)
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3.3.0
        with:
          command: addpath(pwd); addpath(fullfile(pwd,'toolbox','OSLDynamics')); info = spm_osld_install(); disp(info); spm_osld_python

      - name: Run the OSLDynamics toolbox tests
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3.3.0
        with:
          command: addpath(pwd); r = runtests('tests/test_spm_osld.m'); disp(table(r)); assert(~isempty(r) && all([r.Passed]), 'Some tests did not pass.');
